basePath: /api/v1
definitions:
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  habit-tracker_internal_domain.Achievement:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  habit-tracker_internal_domain.CheckIn:
    properties:
      created_at:
        type: string
      date:
        type: string
      habit_id:
        type: integer
      id:
        type: integer
    type: object
  habit-tracker_internal_domain.Frequency:
    enum:
    - daily
    - weekly
    type: string
    x-enum-varnames:
    - FrequencyDaily
    - FrequencyWeekly
  habit-tracker_internal_domain.Habit:
    properties:
      created_at:
        type: string
      current_streak:
        type: integer
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      frequency:
        $ref: '#/definitions/habit-tracker_internal_domain.Frequency'
      id:
        type: integer
      max_streak:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      weekday:
        description: 0=Sunday … 6=Saturday, only for weekly
        type: integer
    type: object
  habit-tracker_internal_domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      level:
        type: integer
      updated_at:
        type: string
      xp:
        type: integer
    type: object
  habit-tracker_internal_usecase.AuthResult:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/habit-tracker_internal_domain.User'
    type: object
  habit-tracker_internal_usecase.CheckInResult:
    properties:
      check_in:
        $ref: '#/definitions/habit-tracker_internal_domain.CheckIn'
      current_streak:
        type: integer
      level:
        type: integer
      max_streak:
        type: integer
      new_achievements:
        items:
          $ref: '#/definitions/habit-tracker_internal_domain.Achievement'
        type: array
      total_xp:
        type: integer
      xp_awarded:
        type: integer
    type: object
  habit-tracker_internal_usecase.Dashboard:
    properties:
      active_habits:
        type: integer
      active_streaks:
        items:
          $ref: '#/definitions/habit-tracker_internal_usecase.HabitStreakSummary'
        type: array
      best_current_streak:
        type: integer
      check_ins_today:
        type: integer
      email:
        type: string
      habits_due_today:
        type: integer
      level:
        type: integer
      total_check_ins:
        type: integer
      xp:
        type: integer
    type: object
  habit-tracker_internal_usecase.HabitStats:
    properties:
      current_streak:
        type: integer
      max_streak:
        type: integer
      total_check_ins:
        type: integer
    type: object
  habit-tracker_internal_usecase.HabitStreakSummary:
    properties:
      current_streak:
        type: integer
      habit_id:
        type: integer
      max_streak:
        type: integer
      title:
        type: string
    type: object
  habit-tracker_internal_usecase.UserAchievementView:
    properties:
      code:
        type: string
      description:
        type: string
      earned:
        type: boolean
      earned_at:
        type: string
      title:
        type: string
    type: object
  internal_delivery_http.checkInRequest:
    properties:
      date:
        description: 'YYYY-MM-DD, optional (default: today)'
        type: string
    type: object
  internal_delivery_http.createHabitRequest:
    properties:
      description:
        type: string
      frequency:
        enum:
        - daily
        - weekly
        example: daily
        type: string
      title:
        type: string
      weekday:
        description: 0=Вс … 6=Сб, для weekly
        example: 1
        type: integer
    required:
    - title
    type: object
  internal_delivery_http.errorResponse:
    properties:
      error:
        type: string
    type: object
  internal_delivery_http.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_delivery_http.registerRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  internal_delivery_http.updateHabitRequest:
    properties:
      description:
        type: string
      frequency:
        enum:
        - daily
        - weekly
        type: string
      title:
        type: string
      weekday:
        type: integer
    required:
    - title
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API трекера привычек (дипломный MVP)
  title: Habit Tracker API
  version: "1.0"
paths:
  /achievements:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/habit-tracker_internal_usecase.UserAchievementView'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
      security:
      - BearerAuth: []
      summary: Достижения пользователя
      tags:
      - achievements
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные входа
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/habit-tracker_internal_usecase.AuthResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
      summary: Вход пользователя
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные регистрации
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/habit-tracker_internal_usecase.AuthResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /dashboard:
    get:
      description: XP, уровень, привычки на сегодня, отметки за сегодня, активные
        streak.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/habit-tracker_internal_usecase.Dashboard'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
      security:
      - BearerAuth: []
      summary: Дашборд пользователя (аналитика)
      tags:
      - dashboard
  /habits:
    get:
      description: Активные привычки (по умолчанию). `today=true` — на сегодня, не
        отмеченные. `archived=true` — архив (soft delete).
      parameters:
      - description: Фильтр «на сегодня»
        in: query
        name: today
        type: boolean
      - description: Только архивные
        in: query
        name: archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/habit-tracker_internal_domain.Habit'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
      security:
      - BearerAuth: []
      summary: Список привычек пользователя
      tags:
      - habits
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные привычки
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.createHabitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/habit-tracker_internal_domain.Habit'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
      security:
      - BearerAuth: []
      summary: Создать привычку
      tags:
      - habits
  /habits/{id}:
    delete:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Архивировать привычку (soft delete)
      tags:
      - habits
    get:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/habit-tracker_internal_domain.Habit'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
      security:
      - BearerAuth: []
      summary: Получить привычку по ID
      tags:
      - habits
    put:
      consumes:
      - application/json
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: integer
      - description: Данные
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.updateHabitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/habit-tracker_internal_domain.Habit'
      security:
      - BearerAuth: []
      summary: Обновить привычку
      tags:
      - habits
  /habits/{id}/check-ins:
    get:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/habit-tracker_internal_domain.CheckIn'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
      security:
      - BearerAuth: []
      summary: История отметок привычки
      tags:
      - habits
    post:
      consumes:
      - application/json
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: integer
      - description: Дата (опционально)
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_delivery_http.checkInRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/habit-tracker_internal_usecase.CheckInResult'
      security:
      - BearerAuth: []
      summary: Отметить выполнение привычки
      tags:
      - habits
  /habits/{id}/restore:
    post:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/habit-tracker_internal_domain.Habit'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
      security:
      - BearerAuth: []
      summary: Восстановить привычку из архива
      tags:
      - habits
  /habits/{id}/stats:
    get:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/habit-tracker_internal_usecase.HabitStats'
      security:
      - BearerAuth: []
      summary: Статистика привычки (streak, всего отметок)
      tags:
      - habits
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/habit-tracker_internal_domain.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_delivery_http.errorResponse'
      security:
      - BearerAuth: []
      summary: Профиль текущего пользователя
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: 'JWT токен. Формат: Bearer &lt;token&gt;'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
